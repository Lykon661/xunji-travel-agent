name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The service lock and FlyAI launcher use Windows-only APIs (msvcrt, .cmd entry points).
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            model-runtime/package-lock.json

      - name: Backend tests
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests

      - name: Model runtime tests
        working-directory: model-runtime
        run: |
          npm ci
          npm test

      - name: Frontend type check and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
